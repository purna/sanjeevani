<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="g06wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEDEC1"/>
      <stop offset="100%" stop-color="#D7C7A5"/>
    </linearGradient>
    <linearGradient id="g06warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="g06soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3C58B"/>
      <stop offset="100%" stop-color="#B89C52"/>
    </linearGradient>
    <linearGradient id="g06stove" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A5C3C"/>
      <stop offset="100%" stop-color="#5A422A"/>
    </linearGradient>
    <linearGradient id="g06clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CA7E5D"/>
      <stop offset="100%" stop-color="#9E5A41"/>
    </linearGradient>
    <linearGradient id="g06window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C7E8F1"/>
      <stop offset="100%" stop-color="#7AC1DC"/>
    </linearGradient>
    <radialGradient id="g06glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE8A3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFE8A3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#g06wall)"/>

  <g id="warm-wash">
    <rect x="0" y="0" width="1920" height="1080" fill="url(#g06warm)" opacity="0.35"/>
  </g>

  <g id="dining-area" transform="translate(260,620)">
    <rect x="-20" y="-20" width="440" height="220" fill="#EED5A6" rx="6" opacity="0.9"/>
    <circle cx="200" cy="90" r="150" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
    <g id="mat">
      <path d="M-40,-30 L440,-30 L410,180 L-70,180 Z" fill="#FFFFFF" opacity="0.9"/>
      <path d="M-40,-30 L440,-30 L410,180 L-70,180 Z" fill="#FFF" opacity="0"/>
    </g>
    <g id="plates">
      <circle cx="80" cy="40" r="24" fill="#FFFFFF"/>
      <circle cx="80" cy="40" r="22" fill="#A56B3A" opacity="0.3"/>
      <circle cx="80" cy="40" r="12" fill="#3A8C42" opacity="0.5"/>
      <circle cx="200" cy="40" r="24" fill="#FFFFFF"/>
      <circle cx="200" cy="40" r="22" fill="#A56B3A" opacity="0.3"/>
      <circle cx="200" cy="40" r="12" fill="#3A8C42" opacity="0.5"/>
      <circle cx="320" cy="40" r="24" fill="#FFFFFF"/>
      <circle cx="320" cy="40" r="22" fill="#A56B3A" opacity="0.3"/>
      <circle cx="320" cy="40" r="12" fill="#3A8C42" opacity="0.5"/>
      <circle cx="140" cy="130" r="20" fill="#FFFFFF"/>
      <circle cx="140" cy="130" r="18" fill="#A56B3A" opacity="0.3"/>
      <circle cx="260" cy="130" r="20" fill="#FFFFFF"/>
      <circle cx="260" cy="130" r="18" fill="#A56B3A" opacity="0.3"/>
    </g>
    <g id="glasses-jugs">
      <rect x="390" y="0" width="28" height="50" fill="#FFFFFF" opacity="0.8"/>
      <rect x="402" y="-14" width="4" height="20" fill="#9AA6B2" opacity="0.6"/>
    </g>
  </g>

  <g id="stove" transform="translate(1380,700)">
    <rect x="-80" y="0" width="160" height="70" fill="url(#g06stove)" rx="4"/>
    <rect x="-70" y="8" width="140" height="18" fill="#5A422A"/>
    <g id="fire">
      <ellipse cx="-20" cy="26" rx="16" ry="8" fill="#FFB74D" opacity="0.85"/>
      <ellipse cx="10" cy="24" rx="12" ry="6" fill="#FF9800" opacity="0.75"/>
      <ellipse cx="30" cy="28" rx="10" ry="5" fill="#FF5722" opacity="0.7"/>
    </g>
    <rect x="-80" y="40" width="160" height="30" fill="#7A5C3C"/>
    <rect x="-70" y="48" width="140" height="8" fill="#FFFFFF" opacity="0.15"/>
    <rect x="-50" y="58" width="100" height="12" fill="#5A422A"/>
  </g>

  <g id="cooking-pots">
    <ellipse cx="1310" cy="600" rx="26" ry="8" fill="#5A422A"/>
    <ellipse cx="1310" cy="594" rx="26" ry="10" fill="url(#g06clay)"/>
    <path d="M1286,590 L1334,590" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  </g>
  <g id="clay-jug">
    <rect x="1440" y="640" width="38" height="60" fill="url(#g06clay)" rx="19"/>
    <rect x="1440" y="650" width="38" height="10" fill="#7A5C3C"/>
    <path d="M1440,700 Q1459,700 1478,700" stroke="#7A5C3C" stroke-width="8"/>
  </g>

  <g id="window">
    <rect x="30" y="120" width="320" height="220" fill="url(#g06window)"/>
    <rect x="30" y="120" width="320" height="220" fill="#FFFFFF" opacity="0.2"/>
    <g stroke="#8A6B4A" stroke-width="6">
      <line x1="190" y1="120" x2="190" y2="340"/>
    </g>
    <rect x="30" y="120" width="320" height="220" fill="url(#g06glow)"/>
  </g>

  <g id="hearth-floor">
    <rect x="900" y="760" width="460" height="320" fill="#EED5A6" opacity="0.8"/>
    <rect x="900" y="760" width="460" height="12" fill="#CA7E5D"/>
    <path d="M900,772 C1000,760 1120,768 1220,760 C1360,748 1480,770 1480,772 L1480,790 C1360,768 1200,760 1060,772 C980,778 900,788 900,790 Z" fill="#CA7E5D" opacity="0.4"/>
  </g>

  <g id="wall-decal">
    <path d="M100,560 C240,520 400,580 560,560 C700,540 860,600 1020,580 C1180,560 1340,620 1500,600" fill="none" stroke="#8A6B4A" stroke-width="4" opacity="0.25"/>
  </g>

  <g id="shadow">
    <ellipse cx="1140" cy="820" rx="120" ry="16" fill="#000000" opacity="0.1"/>
  </g>
</svg>
