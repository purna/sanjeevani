    <path d="M1500,180 L1820,180 L1820,480 L1500,480 Z" fill="none" stroke="#8A6B4A" stroke-width="4"/>
    <g id="window-light">
      <path d="M1500,190 L1820,190 C1810,320 1810,400 1820,470 L1500,470 C1490,400 1490,320 1500,190 Z" fill="#FFFFFF" opacity="0.35"/>
