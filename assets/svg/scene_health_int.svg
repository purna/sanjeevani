    <line x1="-80" y1="-40" x2="-80" y2="0" stroke="#A6893F"/>
    <line x1="80" y1="-40" x2="80" y2="0" stroke="#A6893F"/>
    <rect x="-94" y="0" width="188" height="8" fill="#444" opacity="0.3"/>
  </g>

  <g id="chairs">
