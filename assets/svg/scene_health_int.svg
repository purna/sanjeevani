      <line x1="-220" y1="0" x2="-220" y2="20"/>
      <line x1="-120" y1="0" x2="-120" y2="20"/>
      <line x1="-20" y1="0" x2="-20" y2="20"/>
      <line x1="80" y1="0" x2="80" y2="20"/>
      <line x1="180" y1="0" x2="180" y2="20"/>
      <line x1="280" y1="0" x2="280" y2="20"/>
    </g>
    <g id="supplies">
      <rect x="-310" y="4" width="56" height="16" fill="#4A9BB8" rx="3"/>
      <rect x="-290" y="6" width="30" height="10" fill="#FFFFFF" opacity="0.6"/>
      <rect x="-200" y="4" width="56" height="16" fill="#D83A3A" rx="3"/>
      <rect x="-170" y="6" width="26" height="10" fill="#FFFFFF" opacity="0.6"/>
      <rect x="-80" y="4" width="56" height="16" fill="#4CAF50" rx="3"/>
      <rect x="-50" y="6" width="26" height="10" fill="#FFFFFF" opacity="0.6"/>
      <rect x="100" y="4" width="56" height="16" fill="#8E24AA" rx="3"/>
      <rect x="130" y="6" width="26" height="10" fill="#FFFFFF" opacity="0.6"/>
      <rect x="220" y="4" width="56" height="16" fill="#FFB400" rx="3"/>
