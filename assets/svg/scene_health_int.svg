  </g>

  <g id="shelf-bottom" transform="translate(160,530)">
    <rect x="-340" y="0" width="680" height="16" fill="url(#g05shelf)"/>
    <rect x="0" y="2" width="220" height="12" fill="#E8DCC9" rx="3"/>
