      <circle cx="0" cy="-20" r="16" fill="#5A6B7A"/>
      <rect x="-16" y="-4" width="32" height="24" fill="#5A6B7A"/>
      <circle cx="0" cy="20" r="16" fill="#5A6B7A"/>
