  <g id="floor-box">
    <rect x="80" y="720" width="90" height="60" fill="url(#g05box)" rx="6"/>
    <rect x="80" y="730" width="90" height="8" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <g id="small-plant">
    <rect x="20" y="720" width="20" height="28" fill="#6B4226"/>
    <circle cx="30" cy="700" r="24" fill="#3A8C42" opacity="0.85"/>
    <ellipse cx="30" cy="690" rx="16" ry="6" fill="#3A8C42"/>
  </g>

  <g id="floor-shadow">
    <ellipse cx="1180" cy="740" rx="150" ry="30" fill="#000000" opacity="0.06"/>
    <ellipse cx="480" cy="580" rx="130" ry="20" fill="#000000" opacity="0.05"/>
