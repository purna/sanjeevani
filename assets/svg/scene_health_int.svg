<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="g05wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EFE4"/>
      <stop offset="100%" stop-color="#E3D5C0"/>
    </linearGradient>
    <linearGradient id="g05floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E9DA"/>
      <stop offset="100%" stop-color="#E3D5BF"/>
    </linearGradient>
    <linearGradient id="g05window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B3DFF5"/>
      <stop offset="100%" stop-color="#4A9BB8"/>
    </linearGradient>
    <linearGradient id="g05tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7C7A5"/>
