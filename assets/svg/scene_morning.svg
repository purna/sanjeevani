    <path d="M260,820 C420,770 580,830 740,790 C920,750 1100,810 1280,770 C1500,720 1760,800 1860,760 L1900,840 L0,860 C40,820 120,840 260,820 Z" fill="#5DAA57"/>
  </g>

  <g id="fields-bg">
    <path d="M0,380 Q80,350 1920,360 L1920,520 Q1060,500 0,520 Z" fill="url(#fieldGrad)" opacity="0.9"/>
    <path d="M0,520 Q200,490 1920,505 L1920,600 Q1100,580 0,600 Z" fill="url(#fieldGrad)"/>
  </g>

  <g id="banana-palms">
    <g transform="translate(60,470)">
      <path d="M6,0 C8,-40 14,-40 16,0 C14,10 8,10 6,0 Z" fill="#1B5E20"/>
      <ellipse cx="11" cy="-24" rx="14" ry="6" fill="#1B5E20"/>
      <ellipse cx="11" cy="-34" rx="18" ry="6" fill="#1B5E20"/>
    </g>
      <g transform="translate(1700,460)">
      <path d="M6,0 C8,-44 14,-44 16,0 C14,12 8,12 6,0 Z" fill="#1B5E20"/>
      <ellipse cx="11" cy="-24" rx="15" ry="6" fill="#1B5E20"/>
      <ellipse cx="11" cy="-34" rx="19" ry="6" fill="#1B5E20"/>
    </g>
  </g>

  <g id="village-houses">
    <g transform="translate(270,420)">
      <rect x="-40" y="0" width="80" height="60" fill="#E8DCC9"/>
      <rect x="-40" y="0" width="80" height="18" fill="url(#roofGrad)"/>
      <rect x="-35" y="8" width="70" height="34" fill="#3A6B9E" opacity="0.6"/>
      <rect x="-40" y="60" width="80" height="20" fill="#E8DCC9"/>
      <rect x="-38" y="64" width="76" height="4" fill="#3A6B9E" opacity="0.3"/>
    </g>
    <g transform="translate(480,400)">
      <rect x="-45" y="0" width="90" height="70" fill="#EAD3B8"/>
      <polygon points="-45,0 0,-30 45,0" fill="url(#roofGrad)"/>
      <rect x="-40" y="14" width="80" height="38" fill="#3A6B9E" opacity="0.5"/>
      <rect x="-45" y="70" width="90" height="20" fill="#EAD3B8"/>
