  <g id="dirt-track">
    <path d="M0,640 C260,620 520,630 780,618 C1120,600 1560,612 1920,598 L1920,660 C1470,680 1100,670 780,682 C510,690 260,680 0,660 Z" fill="url(#soilGrad)"/>
    <path d="M0,620 C260,600 520,610 780,598 C1120,580 1560,592 1920,578 L1920,640 C1470,660 1100,650 780,662 C510,670 260,660 0,640 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

