<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B8CFF"/>
      <stop offset="45%" stop-color="#9ED2FF"/>
      <stop offset="100%" stop-color="#FFE8A3"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B7D96F"/>
      <stop offset="100%" stop-color="#8AB84D"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2C98F"/>
      <stop offset="100%" stop-color="#B89C52"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C96C3C"/>
      <stop offset="100%" stop-color="#A24A20"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#skyGrad)"/>

  <g id="sun" transform="translate(150,160)">
    <circle r="70" fill="#FFE8A3" opacity="0.9"/>
