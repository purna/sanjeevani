    <g transform="translate(1020,410)">
      <rect x="-38" y="0" width="76" height="62" fill="#ECD9BF"/>
      <polygon points="-38,0 0,-28 38,0" fill="url(#roofGrad)"/>
      <rect x="-33" y="12" width="66" height="34" fill="#3A6B9E" opacity="0.45"/>
      <rect x="-38" y="62" width="76" height="18" fill="#ECD9BF"/>
    </g>
    <g transform="translate(1320,440)">
      <rect x="-30" y="0" width="60" height="48" fill="#E8DCC9"/>
      <rect x="-30" y="0" width="60" height="15" fill="url(#roofGrad)"/>
      <rect x="-25" y="8" width="50" height="26" fill="#3A6B9E" opacity="0.55"/>
      <rect x="-30" y="48" width="60" height="18" fill="#E8DCC9"/>
    </g>
