      <ellipse cx="11" cy="-24" rx="15" ry="6" fill="#1B5E20"/>
      <ellipse cx="11" cy="-34" rx="20" ry="6" fill="#1B5E20"/>
    </g>
    <g transform="translate(1500,570)">
      <path d="M6,0 C8,-46 14,-46 16,0 C14,12 8,12 6,0 Z" fill="#1B5E20"/>
      <ellipse cx="11" cy="-24" rx="16" ry="6" fill="#1B5E20"/>
      <ellipse cx="11" cy="-34" rx="21" ry="6" fill="#1B5E20"/>
    </g>
  </g>

  <g id="powerlines">
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#444" stroke-width="3"/>
    <g stroke="#444" stroke-width="2">
      <line x1="120" y1="540" x2="110" y2="580"/>
      <line x1="380" y1="540" x2="370" y2="585"/>
      <line x1="640" y1="540" x2="630" y2="575"/>
      <line x1="900" y1="540" x2="890" y2="582"/>
      <line x1="1160" y1="540" x2="1150" y2="578"/>
      <line x1="1420" y1="540" x2="1410" y2="583"/>
      <line x1="1680" y1="540" x2="1670" y2="579"/>
