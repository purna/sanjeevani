<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="g04sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AC6FF"/>
      <stop offset="100%" stop-color="#FFE9B8"/>
    </linearGradient>
    <radialGradient id="g04cloud" cx="50%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g04field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C7E9A6"/>
      <stop offset="100%" stop-color="#97C974"/>
    </linearGradient>
    <linearGradient id="g04wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6CB"/>
      <stop offset="100%" stop-color="#D7C7A5"/>
    </linearGradient>
    <linearGradient id="g04roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AA4C36"/>
      <stop offset="100%" stop-color="#7E311B"/>
