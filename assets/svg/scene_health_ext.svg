    <ellipse cx="780" cy="150" rx="100" ry="34" fill="url(#g04cloud)"/>
    <ellipse cx="1320" cy="120" rx="74" ry="28" fill="url(#g04cloud)"/>
  </g>

  <path d="M0,510 Q400,480 960,495 Q1500,475 1920,500 L1920,560 Q1500,540 960,560 Q400,540 0,540 Z" fill="url(#g04field)" opacity="0.95"/>

  <g id="path">
    <path d="M900,560 C960,555 1020,555 1080,560 L1060,640 C1000,645 940,645 900,638 Z" fill="url(#g04soil)"/>
    <path d="M1080,560 C1100,562 1120,562 1140,560 L1120,638 C1080,640 1100,642 1140,638" fill="url(#g04soil)"/>
  </g>

  <g id="health-post" transform="translate(960,470)">
    <rect x="-150" y="0" width="300" height="170" fill="url(#g04wall)"/>
    <rect x="-150" y="0" width="300" height="22" fill="url(#g04roof)"/>
    <rect x="-150" y="120" width="300" height="50" fill="#3A6B9E" opacity="0.45"/>
    <rect x="-34" y="18" width="68" height="84" fill="#3A6B9E" opacity="0.55"/>
    <rect x="-26" y="26" width="52" height="68" fill="#2E5589"/>

    <g id="cross" transform="translate(10,30)">
      <rect x="-28" y="-60" width="56" height="120" fill="#D83A3A"/>
      <rect x="-72" y="-30" width="144" height="60" fill="#D83A3A"/>
      <rect x="-28" y="-60" width="56" height="16" fill="#FFFFFF" opacity="0.35"/>
      <rect x="-72" y="14" width="144" height="16" fill="#FFFFFF" opacity="0.35"/>
    </g>

    <g id="veranda">
      <rect x="-140" y="170" width="280" height="40" fill="#A58A6F"/>
      <line x1="-140" y1="190" x2="140" y2="190" stroke="#8A6B4A" stroke-width="2"/>
      <rect x="-130" y="178" width="260" height="2" fill="#FFFFFF" opacity="0.4"/>
    </g>

    <g id="bench">
      <rect x="-90" y="188" width="60" height="14" fill="#6B4226"/>
      <rect x="-90" y="200" width="60" height="8" fill="#6B4226"/>
