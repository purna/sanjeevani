    </g>
    <g id="bench2">
      <rect x="30" y="188" width="60" height="14" fill="#6B4226"/>
      <rect x="30" y="200" width="60" height="8" fill="#6B4226"/>
    </g>

    <g id="info-board">
      <rect x="-8" y="-4" width="76" height="34" fill="#4A341D"/>
      <rect x="-4" y="0" width="66" height="24" fill="#E8DCC9"/>
      <rect x="-4" y="22" width="66" height="2" fill="#A58A6F"/>
    </g>
