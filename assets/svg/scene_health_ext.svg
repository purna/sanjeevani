    <circle cx="630" cy="340" r="36" fill="#4CAF50" opacity="0.75"/>
    <path d="M640,380 C680,400 700,440 680,470 C620,460 580,440 600,400 C600,390 610,380 640,380 Z" fill="#2E7D32"/>
    <rect x="628" y="390" width="14" height="80" fill="#6B4226"/>
  </g>

  <g id="ground-shadow">
    <rect x="0" y="610" width="1920" height="470" fill="#3B2A1A" opacity="0.18"/>
