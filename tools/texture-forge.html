<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Texture Forge — Template</title>
<style>
  :root{
    --bg: #14110f;
    --panel: #1c1815;
    --panel2: #221d19;
    --line: #33291f;
    --ink: #ece2d2;
    --ink-dim: #a89a86;
    --brass: #c69a4e;
    --brass-dim: #8a6d38;
    --mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
    --serif: Georgia, 'Iowan Old Style', serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:14px; }

  /* ============ MOBILE-FIRST BASE (single scrolling column) ============ */
  #app{ display:flex; flex-direction:column; min-height:100dvh; }

  header{ padding:16px 16px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:20;}
  h1{ font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:.02em; color:var(--brass); margin:0 0 3px 0;}
  .sub{ color:var(--ink-dim); font-size:11.5px; line-height:1.4; }

  /* group pills */
  #groupRow{ display:flex; gap:8px; padding:12px 16px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line);}
  #groupRow::-webkit-scrollbar{ display:none; }
  .pill{
    flex-shrink:0; padding:8px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel2); color:var(--ink-dim); font-family:var(--mono); font-size:12.5px;
    white-space:nowrap; cursor:pointer;
  }
  .pill.active{ background:var(--brass); border-color:var(--brass); color:#1c1815; font-weight:600; }

  /* texture chip strip */
  #rail{ display:flex; gap:8px; padding:12px 16px; overflow-x:auto; scrollbar-width:none; }
  #rail::-webkit-scrollbar{ display:none; }
  .tex-btn{
    flex-shrink:0; display:flex; align-items:center; gap:7px;
    background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    padding:9px 13px; border-radius:8px; cursor:pointer; font-family:var(--mono);
    font-size:12.5px; white-space:nowrap; min-height:40px;
  }
  .tex-btn.active{ border-color:var(--brass); color:var(--brass); background:#241d15; }
  .swatch{ width:14px; height:14px; border-radius:3px; flex-shrink:0; border:1px solid rgba(0,0,0,.4);}

  /* preview */
  #main{ padding:4px 16px 16px; }
  #previewWrap{
    width:100%; aspect-ratio: 1 / 1; max-height:min(62vw, 380px);
    border:1px solid var(--line); border-radius:10px;
    background:
      linear-gradient(45deg,#2a251f 25%,transparent 25%),
      linear-gradient(-45deg,#2a251f 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#2a251f 75%),
      linear-gradient(-45deg,transparent 75%,#2a251f 75%);
    background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0px;
    position:relative; overflow:hidden;
  }
  #previewSvg{ width:100%; height:100%; display:block; }
  .tile-hint{
    position:absolute; bottom:8px; right:10px; font-size:10.5px; color:var(--ink-dim);
    background:rgba(20,17,15,.8); padding:4px 8px; border-radius:4px; pointer-events:none;
  }

  #shapeLabel{ color:var(--ink-dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin:14px 0 8px;}
  #shapeRow{ display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  #shapeRow::-webkit-scrollbar{ display:none; }
  .shape-preview{
    width:60px; height:60px; flex-shrink:0; border:1px solid var(--line); border-radius:8px; overflow:hidden;
    background:var(--panel2); cursor:pointer;
  }
  .shape-preview svg{ width:100%; height:100%; }
  .shape-preview.active{ outline:2px solid var(--brass); outline-offset:-1px; }

  /* controls */
  #ctrl{ padding:6px 16px 32px; border-top:1px solid var(--line); margin-top:6px;}
  .grp{ margin-top:20px; }
  .grp > label{ display:block; font-size:11px; color:var(--ink-dim); margin-bottom:10px; text-transform:uppercase; letter-spacing:.08em;}

  .colorRow{ display:flex; gap:14px; flex-wrap:wrap; }
  .colorItem{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  .colorItem span{ font-size:10.5px; color:var(--ink-dim); }
  input[type=color]{ width:44px; height:36px; border:1px solid var(--line); border-radius:6px; background:none; padding:0; cursor:pointer; }

  .row{ margin-bottom:16px; }
  .row .rowtop{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .row label{ font-size:12.5px; color:var(--ink); }
  .row .valnum{ color:var(--brass); font-size:12px; font-variant-numeric:tabular-nums; }
  input[type=range]{ width:100%; accent-color:var(--brass); height:28px; }

  button.action{
    width:100%; padding:13px; background:var(--panel2); border:1px solid var(--brass-dim);
    color:var(--brass); font-family:var(--mono); font-size:13px; border-radius:8px; cursor:pointer;
    margin-bottom:10px; letter-spacing:.02em; min-height:46px;
  }
  button.action.primary{ background:var(--brass); color:#1c1815; font-weight:700; border-color:var(--brass); }
  button.action.ghost{ background:transparent; border-color:var(--line); color:var(--ink-dim); }

  .filesize{ font-size:11.5px; color:var(--ink-dim); text-align:right; margin-top:2px; margin-bottom:14px;}
  .codebox{
    background:#0f0d0b; border:1px solid var(--line); border-radius:6px; padding:10px;
    font-size:10.5px; color:#8fbf8a; max-height:180px; overflow:auto; white-space:pre-wrap; word-break:break-all;
    margin-top:8px; display:none;
  }
  .codebox.open{ display:block; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--brass); color:#1c1815; padding:10px 18px; border-radius:6px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;
  }
  .toast.show{ opacity:1; }

  /* ============ DESKTOP: reflow into 3-pane layout ============ */
  @media (min-width: 860px){
    html,body{ height:100vh; overflow:hidden; }
    #app{ height:100vh; display:grid; grid-template-columns:200px 1fr 320px; grid-template-rows:auto 1fr; grid-template-areas: "hdr hdr hdr" "rail main ctrl"; }
    header{ grid-area:hdr; position:static; }
    #groupRow{ display:none; } /* on desktop we show all groups stacked in rail */
    #rail{
      grid-area:rail; flex-direction:column; overflow-y:auto; overflow-x:hidden; border-right:1px solid var(--line);
      padding:16px 10px; align-items:stretch; background:var(--panel2);
    }
    #rail .cat{ color:var(--ink-dim); font-size:10px; letter-spacing:.12em; text-transform:uppercase; margin:14px 6px 6px;}
    .tex-btn{ width:100%; }
    #main{ grid-area:main; overflow-y:auto; padding:20px 24px; }
    #previewWrap{ max-height:none; height:min(50vh, 420px); aspect-ratio:auto; }
    #ctrl{ grid-area:ctrl; overflow-y:auto; border-top:none; border-left:1px solid var(--line); background:var(--panel); padding:18px; margin-top:0;}
    .codebox{ display:block !important; }
    #codeToggleBtn{ display:none; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Texture Forge</h1>
    <div class="sub">Seamless SVG materials used in the story of Template.</div>
  </header>

  <div id="groupRow"></div>
  <nav id="rail"></nav>

  <main id="main">
    <div id="previewWrap">
      <svg id="previewSvg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="tile-hint" id="tileHint">tile 0×0</div>
    </div>
    <div id="shapeLabel">Variant</div>
    <div id="shapeRow"></div>
  </main>

  <div id="ctrl">
    <div class="grp">
      <label>Palette</label>
      <div class="colorRow" id="colorRow"></div>
    </div>

    <div class="grp" id="paramGrp"></div>

    <div class="grp">
      <label>Seed</label>
      <div class="row">
        <div class="rowtop"><label>Value</label><span class="valnum" id="seedVal">1</span></div>
        <input type="range" id="seedRange" min="1" max="9999" value="1">
      </div>
      <button class="action ghost" id="randomizeBtn">🎲 Randomize seed</button>
    </div>

    <div class="grp">
      <label>Export</label>
      <button class="action primary" id="downloadSvgBtn">⬇ Download .svg</button>
      <button class="action" id="copyPatternBtn">Copy &lt;pattern&gt; markup</button>
      <button class="action" id="copyCssBtn">Copy CSS class (data URI)</button>
      <div class="filesize" id="fileSize"></div>
      <button class="action ghost" id="codeToggleBtn">Show CSS code ▾</button>
      <div class="codebox" id="cssPreview"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Copied</div>

<script>
/* ============================================================
   Seeded RNG
============================================================ */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rnd(rng, min, max){ return min + rng() * (max - min); }
function rndInt(rng, min, max){ return Math.floor(rnd(rng, min, max + 1)); }
function pick(rng, arr){ return arr[Math.floor(rng() * arr.length)]; }

/* color helpers */
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHex(r,g,b){
  const c = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#'+c(r)+c(g)+c(b);
}
function shade(hex, amt){
  const {r,g,b} = hexToRgb(hex);
  const f = amt < 0 ? amt+1 : amt;
  const t = amt < 0 ? 0 : 255;
  const p = Math.abs(amt);
  return rgbToHex(r+(t-r)*p*0+ (amt<0? r*f - r : (t-r)*p), g+(amt<0? g*f-g : (t-g)*p), b+(amt<0? b*f-b : (t-b)*p));
}
function mix(hexA, hexB, t){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  return rgbToHex(a.r+(b.r-a.r)*t, a.g+(b.g-a.g)*t, a.b+(b.b-a.b)*t);
}
function fmt(n){ return Math.round(n*100)/100; }

/* ============================================================
   Seamless-tiling + shape-variety helpers
   wrapOffsets/wrapGroup: when an item sits near a tile edge,
   also draw it translated by ±w/±h so it overlaps the seam and
   the pattern reads as continuous once tiled. blobPath/starPath/
   leafPath/diamondPath give scatter-type textures more than one
   silhouette to draw from.
============================================================ */
function wrapOffsets(x,y,w,h,margin){
  const offs = [[0,0]];
  const left = x < margin, right = x > w-margin;
  const top = y < margin, bottom = y > h-margin;
  if(left) offs.push([w,0]);
  if(right) offs.push([-w,0]);
  if(top) offs.push([0,h]);
  if(bottom) offs.push([0,-h]);
  if(left&&top) offs.push([w,h]);
  if(left&&bottom) offs.push([w,-h]);
  if(right&&top) offs.push([-w,h]);
  if(right&&bottom) offs.push([-w,-h]);
  return offs;
}
function wrapGroup(x,y,w,h,margin,inner){
  return wrapOffsets(x,y,w,h,margin).map(([dx,dy])=>
    `<g transform="translate(${fmt(x+dx)} ${fmt(y+dy)})">${inner}</g>`
  ).join('');
}
function blobPath(rng, r, sidesMin, sidesMax){
  const sides = rndInt(rng, sidesMin||5, sidesMax||9);
  let pts=[];
  for(let s=0;s<sides;s++){
    const ang=(s/sides)*Math.PI*2;
    const rr = r*rnd(rng,0.62,1.28);
    pts.push([Math.cos(ang)*rr, Math.sin(ang)*rr]);
  }
  let d = `M ${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
  for(let i=1;i<pts.length;i++) d += ` L ${fmt(pts[i][0])} ${fmt(pts[i][1])}`;
  return d+' Z';
}
function starPath(rng, rOuter, pointsMin, pointsMax){
  const points = rndInt(rng, pointsMin||5, pointsMax||7);
  const rInner = rOuter*rnd(rng,0.36,0.58);
  let pts=[];
  for(let i=0;i<points*2;i++){
    const ang = (i/(points*2))*Math.PI*2 - Math.PI/2;
    const rr = i%2===0? rOuter: rInner;
    pts.push([Math.cos(ang)*rr, Math.sin(ang)*rr]);
  }
  let d = `M ${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
  for(let i=1;i<pts.length;i++) d += ` L ${fmt(pts[i][0])} ${fmt(pts[i][1])}`;
  return d+' Z';
}
function leafPath(s){
  return `M0,${fmt(-s/2)} C ${fmt(s*0.35)},${fmt(-s*0.2)} ${fmt(s*0.35)},${fmt(s*0.2)} 0,${fmt(s/2)} C ${fmt(-s*0.35)},${fmt(s*0.2)} ${fmt(-s*0.35)},${fmt(-s*0.2)} 0,${fmt(-s/2)} Z`;
}
function diamondPath(r){
  return `M0,${fmt(-r)} L${fmt(r)},0 L0,${fmt(r)} L${fmt(-r)},0 Z`;
}

/* ============================================================
   Texture Library
============================================================ */
const STORY_TEXTURE_CONFIG = {"story":"Template","keys":["stone","wood_oak","fabric_weave","water_still","grass"]};
const FULL_LIB = {

  water_still: {
    label:'Still Water', group:'Water',
    colors:['#1c4f63','#2e7488','#bfe6e8'],
    colorNames:['deep','mid','glint'],
    params:{ lines:{label:'Ripple lines', min:3, max:18, step:1, def:7},
             wave:{label:'Wave height', min:1, max:14, step:0.5, def:3},
             opacity:{label:'Line opacity', min:0.1, max:0.9, step:0.05, def:0.35},
             thickness:{label:'Line thickness', min:0.3, max:4, step:0.1, def:1.1} },
    shapes:[
      { key:'calm', label:'Calm', build(rng,p,c){
        const w=140,h=90; let body=`<rect width="${w}" height="${h}" fill="${c[0]}"/>`;
        body += `<rect width="${w}" height="${h}" fill="url(#g_${c.uid})" opacity=".5"/>`;
        for(let i=0;i<p.lines;i++){
          const y = rnd(rng, 4, h-4);
          const amp = rnd(rng, p.wave*0.5, p.wave);
          const col = rng()>0.72? c[2] : c[1];
          const tw = fmt(rnd(rng, p.thickness*0.5, p.thickness*1.4));
          let d = `M ${-10} ${fmt(y)}`;
          for(let x=0;x<=w+10;x+=w/8){
            const yy = y + Math.sin((x/w)*Math.PI*2 + i)*amp;
            d += ` Q ${fmt(x+w/16)} ${fmt(yy-amp)} ${fmt(x+w/8)} ${fmt(y)}`;
          }
          body += `<path d="${d}" stroke="${col}" stroke-width="${tw}" fill="none" opacity="${fmt(p.opacity)}"/>`;
          if(y - amp < 6) body += `<path d="${d}" stroke="${col}" stroke-width="${tw}" fill="none" opacity="${fmt(p.opacity)}" transform="translate(0 ${h})"/>`;
          if(y + amp > h-6) body += `<path d="${d}" stroke="${col}" stroke-width="${tw}" fill="none" opacity="${fmt(p.opacity)}" transform="translate(0 ${-h})"/>`;
        }
        return {w,h,body,defs:`<linearGradient id="g_${c.uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[1]}" stop-opacity=".3"/><stop offset="1" stop-color="${c[0]}" stop-opacity="0"/></linearGradient>`};
      }},
      { key:'eddies', label:'Eddies', build(rng,p,c){
        const w=130,h=100; let body=`<rect width="${w}" height="${h}" fill="${c[0]}"/>`;
        const rings = Math.max(2, Math.round(p.lines/2));
        for(let i=0;i<rings;i++){
          const cx=rnd(rng,0,w), cy=rnd(rng,0,h);
          const baseR = rnd(rng, 6, 9+p.wave);
          const col = rng()>0.7? c[2]:c[1];
          const rot = rnd(rng,0,360);
          let inner='';
          for(let r=baseR; r>2; r-=rnd(rng,2.5,4.5)){
            inner += `<circle r="${fmt(r)}" fill="none" stroke="${col}" stroke-width="${fmt(rnd(rng,p.thickness*0.4,p.thickness))}" opacity="${fmt(p.opacity*rnd(rng,0.6,1))}"/>`;
          }
          body += wrapGroup(cx,cy,w,h,baseR, `<g transform="rotate(${fmt(rot)})">${inner}</g>`);
        }
        return {w,h,body};
      }}
    ]
  },

  water_fast: {
    label:'Fast Water', group:'Water',
    colors:['#134b5e','#3fa4bd','#eaf7f8'],
    colorNames:['base','flow','foam'],
    params:{ chevrons:{label:'Chevron rows', min:2, max:10, step:1, def:4},
             foam:{label:'Foam flecks', min:0, max:60, step:2, def:16},
             turbulence:{label:'Turbulence', min:1, max:16, step:0.5, def:5},
             thickness:{label:'Line thickness', min:0.5, max:5, step:0.1, def:1.6} },
    shapes:[
      { key:'rapids', label:'Rapids', build(rng,p,c){
        const w=120,h=80; let body=`<rect width="${w}" height="${h}" fill="${c[0]}"/>`;
        const rowH = h/p.chevrons;
        for(let i=0;i<p.chevrons;i++){
          const y = rowH*i + rowH/2 + rnd(rng,-3,3);
          const amp = rnd(rng, p.turbulence*0.5, p.turbulence);
          let d = `M -10 ${y}`;
          for(let x=0;x<=w+20;x+=14){
            d += ` L ${x} ${y + (Math.floor(x/14)%2? amp: -amp)}`;
          }
          body += `<path d="${d}" stroke="${c[1]}" stroke-width="${fmt(rnd(rng,p.thickness*0.6,p.thickness*1.5))}" fill="none" opacity="${fmt(rnd(rng,0.35,0.7))}"/>`;
        }
        for(let i=0;i<p.foam;i++){
          const x=rnd(rng,0,w), y=rnd(rng,0,h), r=rnd(rng,0.5,2.2);
          body += wrapGroup(x,y,w,h,r, `<circle r="${fmt(r)}" fill="${c[2]}" opacity="${fmt(rnd(rng,0.4,0.85))}"/>`);
        }
        return {w,h,body};
      }},
      { key:'churn', label:'Churn', build(rng,p,c){
        const w=110,h=90; let body=`<rect width="${w}" height="${h}" fill="${c[0]}"/>`;
        const swirls = Math.max(3, p.chevrons+2);
        for(let i=0;i<swirls;i++){
          const cx=rnd(rng,0,w), cy=rnd(rng,0,h), r=rnd(rng,6,10+p.turbulence);
          const rot=rnd(rng,0,360);
          const col = rng()>0.5? c[1]:c[2];
          const inner = `<path d="M ${fmt(-r)} 0 A ${fmt(r)} ${fmt(r*0.6)} 0 1 1 ${fmt(r)} 0" fill="none" stroke="${col}" stroke-width="${fmt(rnd(rng,p.thickness*0.6,p.thickness*1.3))}" opacity="${fmt(rnd(rng,0.4,0.75))}"/>`;
          body += wrapGroup(cx,cy,w,h,r, `<g transform="rotate(${fmt(rot)})">${inner}</g>`);
        }
        for(let i=0;i<p.foam;i++){
          const x=rnd(rng,0,w), y=rnd(rng,0,h), r=rnd(rng,0.5,2);
          body += wrapGroup(x,y,w,h,r, `<circle r="${fmt(r)}" fill="${c[2]}" opacity="${fmt(rnd(rng,0.4,0.85))}"/>`);
        }
        return {w,h,body};
      }}
    ]
  },

  wood_oak: {
    label:'Oak Plank', group:'Wood',
    colors:['#a9723f','#8a5a2e','#5e3c1c'],
    colorNames:['base','grain','dark'],
    params:{ grainLines:{label:'Grain lines', min:4, max:26, step:1, def:11},
             knots:{label:'Knot chance %', min:0, max:100, step:5, def:20},
             warp:{label:'Grain warp', min:1, max:20, step:1, def:6},
             thickness:{label:'Line thickness', min:0.3, max:3, step:0.1, def:1} },
    shapes:[
      { key:'plank', label:'Plank', build(rng,p,c){
        const w=100,h=140; let body=`<rect width="${w}" height="${h}" fill="${c[0]}"/>`;
        for(let i=0;i<p.grainLines;i++){
          const x0 = rnd(rng,-6,w+6);
          const bow = rnd(rng,4,p.warp);
          const col = rng()>0.7? c[2] : c[1];
          let d = `M ${x0} -6`;
          d += ` C ${x0+bow} ${h*0.33} ${x0-bow} ${h*0.66} ${x0+rnd(rng,-bow,bow)} ${h+6}`;
          body += `<path d="${d}" stroke="${col}" stroke-width="${fmt(rnd(rng,p.thickness*0.5,p.thickness*1.6))}" fill="none" opacity="${fmt(rnd(rng,0.3,0.65))}"/>`;
        }
        const knotCount = rng()*100 < p.knots ? rndInt(rng,1,2) : 0;
        for(let k=0;k<knotCount;k++){
          const kx=rnd(rng,20,w-20), ky=rnd(rng,20,h-20);
          for(let r=10;r>0;r-=2.2){
            body += `<ellipse cx="${fmt(kx)}" cy="${fmt(ky)}" rx="${fmt(r*0.6)}" ry="${fmt(r)}" fill="none" stroke="${c[2]}" stroke-width="0.6" opacity="0.5" transform="rotate(${fmt(rnd(rng,-15,15))} ${fmt(kx)} ${fmt(ky)})"/>`;
          }
        }
        return {w,h,body};
      }},
      { key:'planks3', label:'3-Plank', build(rng,p,c){
        const w=140,h=90; let body='';
        const pw = w/3;
        for(let pi=0;pi<3;pi++){
          const ox = pi*pw;
          body += `<rect x="${ox}" width="${pw-2}" height="${h}" fill="${mix(c[0],c[2],rnd(rng,0,0.2))}"/>`;

          let inner;

          else if(shapeType==='diamond') inner = `<path d="${diamondPath(r)}" fill="${c[1]}"/>`;
          else inner = `<path d="${starPath(rng, r, 5,5)}" fill="${c[1]}"/>`;
          body += wrapGroup(x,y,w,h,r, `<g transform="rotate(${fmt(rot)})">${inner}</g>`);
        }
        return {w,h,body};
      }}
    ]
  },

  fabric_weave: {
    label:'Woven Linen', group:'Fabric',
    colors:['#5c4a34','#8a7350','#3c2f20'],
    colorNames:['warp','weft','shadow'],
    params:{ thread:{label:'Thread width', min:3, max:14, step:0.5, def:6},
             gap:{label:'Thread gap', min:0, max:6, step:0.5, def:1.5},
             fray:{label:'Fray / irregularity', min:0, max:14, step:1, def:3} },
    shapes:[
      { key:'basket', label:'Basket weave', build(rng,p,c){
        const t=p.thread, g=p.gap, u=t+g;
        const w=u*2, h=u*2;
        let body = `<rect width="${w}" height="${h}" fill="${c[2]}"/>`;
        for(let row=0; row<2; row++){
          const y = row*u;
          const jitter = rnd(rng,-p.fray*0.3,p.fray*0.3);
          body += `<rect x="${-u}" y="${fmt(y+jitter)}" width="${w+u*2}" height="${fmt(t)}" fill="${c[1]}" opacity="0.9"/>`;
        }
        for(let col=0; col<2; col++){
          const x = col*u;
          for(let row=0; row<2; row++){
            const y=row*u;
            const onTop = (col+row)%2===0;
            if(onTop){
              body += `<rect x="${fmt(x+rnd(rng,-p.fray*0.2,p.fray*0.2))}" y="${fmt(y-g)}" width="${fmt(t)}" height="${fmt(t+g*2)}" fill="${c[0]}"/>`;
            }
          }
        }
        return {w,h,body};
      }}
    ]
  },

  egypt_mud_brick: {
    label:'Egyptian Mud Brick', group:'Moses', colors:['#a9683f','#70442d','#d29a68'], colorNames:['brick','mortar','sun'],
    params:{ courses:{label:'Brick courses',min:2,max:8,step:1,def:4}, roughness:{label:'Surface roughness',min:4,max:50,step:1,def:22} },
    shapes:[{key:'stretcher',label:'Stretcher bond',build(rng,p,c){const w=120,h=80,row=h/p.courses;let body=`<rect width="${w}" height="${h}" fill="${c[1]}"/>`;for(let y=0;y<p.courses;y++){const off=y%2?15:0;for(let x=-30;x<w+30;x+=30){const bx=x+off;body+=`<rect x="${bx+1}" y="${y*row+1}" width="28" height="${row-2}" rx="1.5" fill="${mix(c[0],c[2],rnd(rng,0,.22))}"/>`;}}for(let i=0;i<p.roughness;i++)body+=`<circle cx="${fmt(rnd(rng,0,w))}" cy="${fmt(rnd(rng,0,h))}" r="${fmt(rnd(rng,.4,1.5))}" fill="${c[1]}" opacity=".45"/>`;return{w,h,body};}}]
  },
  nile_reeds: {
    label:'Nile Reeds', group:'Moses', colors:['#1d6573','#80a45a','#c6ad58'], colorNames:['water','reed','highlight'],
    params:{ reeds:{label:'Reed count',min:5,max:30,step:1,def:16}, sway:{label:'Reed sway',min:1,max:12,step:1,def:5} },
    shapes:[{key:'riverbank',label:'Riverbank',build(rng,p,c){const w=120,h=100;let body=`<rect width="${w}" height="${h}" fill="${c[0]}"/>`;for(let i=0;i<p.reeds;i++){const x=rnd(rng,0,w),top=rnd(rng,12,58),bend=rnd(rng,-p.sway,p.sway),col=rng()>.7?c[2]:c[1];body+=`<path d="M${fmt(x)} 105 Q${fmt(x+bend)} ${fmt((top+100)/2)} ${fmt(x+bend)} ${fmt(top)}" stroke="${col}" stroke-width="${fmt(rnd(rng,1,2.5))}" fill="none"/><ellipse cx="${fmt(x+bend)}" cy="${fmt(top-3)}" rx="2" ry="7" fill="${col}"/>`; }return{w,h,body};}}]
  },
  desert_sand: {
    label:'Wilderness Sand', group:'Moses', colors:['#c8914e','#9b6738','#edc77e'], colorNames:['sand','shadow','sun'],
    params:{ ridges:{label:'Wind ridges',min:3,max:18,step:1,def:8}, grit:{label:'Stone grit',min:0,max:60,step:2,def:20} },
    shapes:[{key:'dunes',label:'Wind dunes',build(rng,p,c){const w=140,h=90;let body=`<rect width="${w}" height="${h}" fill="${c[0]}"/>`;for(let i=0;i<p.ridges;i++){const y=rnd(rng,0,h);body+=`<path d="M-10 ${fmt(y)} Q35 ${fmt(y-rnd(rng,3,12))} 75 ${fmt(y)} T150 ${fmt(y)}" stroke="${rng()>.25?c[2]:c[1]}" opacity=".45" fill="none"/>`;}for(let i=0;i<p.grit;i++)body+=`<circle cx="${fmt(rnd(rng,0,w))}" cy="${fmt(rnd(rng,0,h))}" r="${fmt(rnd(rng,.35,1.2))}" fill="${c[1]}" opacity=".55"/>`;return{w,h,body};}}]
  },
  bulrush_basket: {
    label:'Bulrush Basket', group:'Moses', colors:['#bd8b45','#795329','#d7b66e'], colorNames:['reed','shadow','light'],
    params:{ strand:{label:'Strand width',min:3,max:12,step:1,def:7}, gap:{label:'Weave gap',min:0,max:4,step:.5,def:1} },
    shapes:[{key:'woven',label:'Woven reeds',build(rng,p,c){const u=p.strand+p.gap,w=u*4,h=u*4;let body=`<rect width="${w}" height="${h}" fill="${c[1]}"/>`;for(let y=0;y<4;y++)for(let x=0;x<4;x++){const col=(x+y)%2?c[0]:c[2];body+=`<rect x="${x*u}" y="${y*u}" width="${p.strand}" height="${p.strand}" rx="1" fill="${col}"/>`;body+=`<rect x="${x*u+p.strand}" y="${y*u}" width="${p.gap}" height="${u}" fill="${c[1]}"/>`;}return{w,h,body};}}]
  },
  hammered_gold: {
    label:'Tabernacle Gold', group:'Moses', colors:['#c9952f','#805821','#f2cf67'], colorNames:['gold','shadow','glint'],
    params:{ dents:{label:'Hammer marks',min:5,max:70,step:1,def:32}, glints:{label:'Bright glints',min:1,max:20,step:1,def:7} },
    shapes:[{key:'hammered',label:'Hammered sheet',build(rng,p,c){const w=100,h=100;let body=`<rect width="${w}" height="${h}" fill="${c[0]}"/>`;for(let i=0;i<p.dents;i++){const x=rnd(rng,0,w),y=rnd(rng,0,h),r=rnd(rng,2,7);body+=`<circle cx="${fmt(x)}" cy="${fmt(y)}" r="${fmt(r)}" fill="none" stroke="${c[1]}" opacity=".25"/>`;}for(let i=0;i<p.glints;i++)body+=`<circle cx="${fmt(rnd(rng,0,w))}" cy="${fmt(rnd(rng,0,h))}" r="${fmt(rnd(rng,.5,2))}" fill="${c[2]}"/>`;return{w,h,body};}}]
  },
  stone_tablets: {
    label:'Stone Tablets', group:'Moses', colors:['#77746b','#44443f','#b8b2a5'], colorNames:['stone','cut','edge'],
    params:{ cracks:{label:'Fine cracks',min:1,max:20,step:1,def:7}, grain:{label:'Stone grain',min:3,max:45,step:1,def:18} },
    shapes:[{key:'hewn',label:'Hewn stone',build(rng,p,c){const w=120,h=90;let body=`<rect width="${w}" height="${h}" fill="${c[0]}"/>`;for(let i=0;i<p.grain;i++)body+=`<circle cx="${fmt(rnd(rng,0,w))}" cy="${fmt(rnd(rng,0,h))}" r="${fmt(rnd(rng,.5,2.2))}" fill="${rng()>.5?c[1]:c[2]}" opacity=".3"/>`;for(let i=0;i<p.cracks;i++){const x=rnd(rng,0,w),y=rnd(rng,0,h);body+=`<path d="M${fmt(x)} ${fmt(y)} l${fmt(rnd(rng,-8,8))} ${fmt(rnd(rng,3,12))} l${fmt(rnd(rng,-5,5))} ${fmt(rnd(rng,2,8))}" stroke="${c[1]}" opacity=".55" fill="none"/>`;}return{w,h,body};}}]
  }

};
const LIB = Object.fromEntries(STORY_TEXTURE_CONFIG.keys.filter(key => FULL_LIB[key]).map(key => {
  const item = FULL_LIB[key];
  return [key, {...item, group: STORY_TEXTURE_CONFIG.story}];
}));

/* ============================================================
   State
============================================================ */
let state = {
  texKey: 'stone',
  shapeKey: FULL_LIB['stone'].shapes[0].key,
  seed: 1,
  colors: [],
  params: {},
  activeGroup: 'Template'
};

function currentTex(){ return LIB[state.texKey]; }
function currentShape(){ return currentTex().shapes.find(s=>s.key===state.shapeKey) || currentTex().shapes[0]; }

function initStateForTexture(key){
  const t = LIB[key];
  state.texKey = key;
  state.shapeKey = t.shapes[0].key;
  state.colors = t.colors.slice();
  state.params = {};
  Object.entries(t.params).forEach(([k,cfg])=>{ state.params[k] = cfg.def; });
  state.activeGroup = t.group;
}

/* ============================================================
   UI Build
============================================================ */
const groups = {};
Object.entries(LIB).forEach(([key, t])=>{
  groups[t.group] = groups[t.group] || [];
  groups[t.group].push({key, ...t});
});
const groupNames = Object.keys(groups);

function buildGroupRow(){
  const row = document.getElementById('groupRow');
  row.innerHTML = '';
  groupNames.forEach(name=>{
    const p = document.createElement('button');
    p.className = 'pill' + (name===state.activeGroup? ' active':'');
    p.textContent = name;
    p.onclick = ()=>{ state.activeGroup = name; buildGroupRow(); buildRail(); };
    row.appendChild(p);
  });
}

function buildRail(){
  const railEl = document.getElementById('rail');
  railEl.innerHTML = '';
  // Desktop: show every group with headers. Mobile: only active group (row hidden shows via CSS media query anyway,
  // but we keep DOM identical and let CSS decide visibility via layout; simplest is to always render grouped list,
  // and rely on groupRow for mobile filtering is unnecessary once all groups render — so filter for mobile only.
  const isDesktop = window.matchMedia('(min-width: 860px)').matches;
  const toRender = isDesktop ? groupNames : [state.activeGroup];
  toRender.forEach(name=>{
    if(isDesktop){
      const cat = document.createElement('div');
      cat.className='cat'; cat.textContent = name;
      railEl.appendChild(cat);
    }
    groups[name].forEach(t=>{
      const btn = document.createElement('button');
      btn.className = 'tex-btn' + (t.key===state.texKey ? ' active':'');
      btn.dataset.key = t.key;
      btn.innerHTML = `<span class="swatch" style="background:${t.colors[0]}"></span>${t.label}`;
      btn.onclick = ()=>{ initStateForTexture(t.key); buildGroupRow(); buildRail(); render(); };
      railEl.appendChild(btn);
    });
  });
}

window.addEventListener('resize', ()=>{ buildRail(); });

function buildShapeRow(){
  const row = document.getElementById('shapeRow');
  row.innerHTML = '';
  currentTex().shapes.forEach(s=>{
    const box = document.createElement('div');
    box.className = 'shape-preview' + (s.key===state.shapeKey?' active':'');
    box.title = s.label;
    box.onclick = ()=>{ state.shapeKey = s.key; render(); };
    row.appendChild(box);
  });
}

function buildColorRow(){
  const wrap = document.getElementById('colorRow');
  wrap.innerHTML = '';
  const names = currentTex().colorNames;
  state.colors.forEach((col, i)=>{
    const item = document.createElement('div');
    item.className = 'colorItem';
    const input = document.createElement('input');
    input.type='color'; input.value = col.length===7? col : '#888888';
    input.oninput = (e)=>{ state.colors[i] = e.target.value; render(); };
    const span = document.createElement('span');
    span.textContent = names[i] || ('c'+i);
    item.appendChild(input); item.appendChild(span);
    wrap.appendChild(item);
  });
}

function buildParamGrp(){
  const wrap = document.getElementById('paramGrp');
  wrap.innerHTML = '<label>Parameters</label>';
  const t = currentTex();
  Object.entries(t.params).forEach(([k,cfg])=>{
    const row = document.createElement('div');
    row.className='row';
    const top = document.createElement('div'); top.className='rowtop';
    const lab = document.createElement('label'); lab.textContent = cfg.label;
    const val = document.createElement('span'); val.className='valnum'; val.textContent = state.params[k];
    top.appendChild(lab); top.appendChild(val);
    const inp = document.createElement('input');
    inp.type='range'; inp.min=cfg.min; inp.max=cfg.max; inp.step=cfg.step; inp.value=state.params[k];
    inp.oninput = (e)=>{
      state.params[k] = parseFloat(e.target.value);
      val.textContent = state.params[k];
      render();
    };
    row.appendChild(top); row.appendChild(inp);
    wrap.appendChild(row);
  });
}

/* ============================================================
   Render
============================================================ */
let lastGenerated = null;

function buildPatternMarkup(){
  const rng = mulberry32(state.seed);
  const shape = currentShape();
  const c = state.colors.slice();
  c.uid = state.texKey + '_' + state.seed;
  const result = shape.build(rng, state.params, c);
  return result;
}

function render(){
  buildShapeRow();
  buildColorRow();
  buildParamGrp();

  const gen = buildPatternMarkup();
  lastGenerated = gen;
  const patId = 'p_' + state.texKey + '_' + state.shapeKey;

  const svg = document.getElementById('previewSvg');
  svg.innerHTML = `
    <defs>
      ${gen.defs || ''}
      <pattern id="${patId}" width="${gen.w}" height="${gen.h}" patternUnits="userSpaceOnUse">
        ${gen.body}
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#${patId})"/>
  `;
  document.getElementById('tileHint').textContent = `tile ${gen.w}×${gen.h}px`;

  updateCssPreview(gen, patId);
}

function standaloneSvgString(gen, patId, exportSize){
  const size = exportSize || 256;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs>${gen.defs||''}<pattern id="${patId}" width="${gen.w}" height="${gen.h}" patternUnits="userSpaceOnUse">${gen.body}</pattern></defs><rect width="${size}" height="${size}" fill="url(#${patId})"/></svg>`;
}

function updateCssPreview(gen, patId){
  const svgStr = standaloneSvgString(gen, patId, gen.w > gen.h ? gen.w : gen.h);
  const encoded = encodeURIComponent(svgStr).replace(/'/g,'%27').replace(/"/g,'%22');
  const className = `.tex-${state.texKey.replace(/_/g,'-')}`;
  const css = `${className} {\n  background-image: url("data:image/svg+xml,${encoded}");\n  background-repeat: repeat;\n  background-size: ${gen.w}px ${gen.h}px;\n}`;
  document.getElementById('cssPreview').textContent = css;
  const bytes = new Blob([svgStr]).size;
  document.getElementById('fileSize').textContent = `~${bytes} bytes / tile`;
}

/* ============================================================
   Actions
============================================================ */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

document.getElementById('seedRange').oninput = (e)=>{
  state.seed = parseInt(e.target.value);
  document.getElementById('seedVal').textContent = state.seed;
  render();
};
document.getElementById('randomizeBtn').onclick = ()=>{
  state.seed = rndInt(mulberry32(Date.now()%100000), 1, 9999);
  document.getElementById('seedRange').value = state.seed;
  document.getElementById('seedVal').textContent = state.seed;
  render();
};

document.getElementById('downloadSvgBtn').onclick = ()=>{
  const gen = lastGenerated;
  const patId = 'p_' + state.texKey + '_' + state.shapeKey;
  const str = standaloneSvgString(gen, patId, gen.w);
  const blob = new Blob([str], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${state.texKey}-${state.shapeKey}-${state.seed}.svg`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Downloaded .svg');
};

document.getElementById('copyPatternBtn').onclick = ()=>{
  const gen = lastGenerated;
  const patId = 'p_' + state.texKey + '_' + state.shapeKey;
  const markup = `${gen.defs||''}\n<pattern id="${patId}" width="${gen.w}" height="${gen.h}" patternUnits="userSpaceOnUse">\n  ${gen.body}\n</pattern>`;
  navigator.clipboard.writeText(markup);
  showToast('Pattern markup copied');
};

document.getElementById('copyCssBtn').onclick = ()=>{
  navigator.clipboard.writeText(document.getElementById('cssPreview').textContent);
  showToast('CSS class copied');
};

document.getElementById('codeToggleBtn').onclick = (e)=>{
  const box = document.getElementById('cssPreview');
  const open = box.classList.toggle('open');
  e.target.textContent = open ? 'Hide CSS code ▴' : 'Show CSS code ▾';
};

/* ============================================================
   Init
============================================================ */
initStateForTexture('water_still');
buildGroupRow();
buildRail();
render();
</script>
</body>
</html>
