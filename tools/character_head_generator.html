<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Head Generator — Template</title>
    <link href="../fonts.css" rel="stylesheet">
    <!-- JSZip for bulk exporting -->
    <script src="../vendor/jszip.3.10.1.min.js"></script>
    <script>window.__i18nConfig = { localeDir: 'locales/' };</script>

<style>
  :root {
    --bg-color: #0d0d12;
    --panel-bg: #16161c;
    --panel-2: #1e1e26;
    --text-color: #d1d1d6;
    --text-dim: #9aa0a6;
    --accent: #4a5c78;
    --accent-alt: #3d8f5c;
    --border: #2a2a35;
    --iron: #333340;
    --font-display: "Bangers", serif;
    --font-body: "Nunito", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; height: 100vh; overflow: hidden;
    font-family: var(--font-body);
    background: var(--bg-color);
    color: var(--text-color);
    display: flex;
  }

  /* Landscape Layout Enforced */
  .workspace { display: flex; flex-direction: row; width: 100%; height: 100%; }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    width: 400px; min-width: 400px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    padding: 22px 20px 18px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .sidebar::-webkit-scrollbar { width: 8px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .brand {
    font-family: var(--font-display);
    font-size: 1.55rem; font-weight: 600; letter-spacing: .02em;
    color: var(--text-color);
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .brand small { font-family: var(--font-body); font-size: .62rem; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); font-weight: 600; }

  h3.section-title {
    font-family: var(--font-display);
    font-size: 1.05rem; font-weight: 600; color: var(--accent);
    margin: 0 0 10px; letter-spacing: .05em; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  h3.section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

  .control-group { display: flex; flex-direction: column; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .control-group:last-of-type { border-bottom: none; }

  label.field { font-size: .78rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 5px; }
  label.field span.val { color: var(--accent); font-weight: 600; }
  label.row { flex-direction: row; align-items: center; justify-content: space-between; }

  select, input[type="range"] {
    width: 100%; padding: 7px 8px;
    background: var(--panel-2); color: var(--text-color);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: var(--font-body); font-size: .82rem;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .color-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .76rem; color: var(--text-dim); min-height: 28px; }
  input[type="color"] {
    width: 40px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 4px;
    background: none; cursor: pointer; flex-shrink: 0;
  }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--text-dim); margin-top: 2px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }

  button {
    font-family: var(--font-body); font-weight: 600; font-size: .8rem;
    background: var(--accent); color: #fff;
    border: 1px solid var(--accent); padding: 10px 12px; border-radius: 4px;
    cursor: pointer; letter-spacing: .02em;
    transition: background .15s ease, transform .1s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: translateY(1px); }
  button.secondary { background: var(--panel-2); border-color: var(--border); color: var(--text-color); }
  button.secondary:hover { background: var(--border); }
  button.success { background: var(--accent-alt); border-color: var(--accent-alt); }
  button.wide { width: 100%; }

  .preset-row { display: flex; gap: 8px; }
  .preset-row select { flex: 1; }
  .preset-row button { flex: 0 0 auto; }

  .action-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding-top: 14px; }
  .row-buttons { display: flex; gap: 8px; }

  /* ---------- CANVAS AREA ---------- */
  .canvas-area {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, #1e1e26 0%, var(--bg-color) 80%);
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 24px 24px;
    position: relative;
    gap: 24px;
  }
  
  .medallion {
    width: 440px; height: 440px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #b3b3b3 0%, #666666 50%, #333333 100%);
    border: 4px solid #111;
    box-shadow:
      0 0 0 6px var(--bg-color),
      0 0 0 10px var(--iron),
      0 25px 50px rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .medallion::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.8); pointer-events: none;
  }
  #svg-container { width: 100%; height: 100%; }
  #svg-container svg { width: 100%; height: 100%; display: block; }
  
  /* Strictly enforce solid fills, preventing strokes globally inside SVG */
  #svg-container svg * { stroke: none !important; }

  .caption { text-align: center; font-family: var(--font-display); color: var(--text-color); }
  .caption .name { font-size: 1.8rem; font-weight: 600; letter-spacing: .03em; }
  .caption .name::before, .caption .name::after { content: "✦"; color: var(--iron); font-size: 1rem; margin: 0 14px; vertical-align: middle; }
  .caption .sub { font-family: var(--font-body); font-size: .75rem; text-transform: uppercase; letter-spacing: .2em; color: var(--accent); margin-top: 4px; }

  .lang-toggle {
    margin-top: 10px; padding: 10px 16px; font-family: var(--font-body);
    font-size: 1rem; font-weight: 600; background: var(--accent); color: #fff;
    border: 1px solid var(--accent); border-radius: 4px; cursor: pointer;
    transition: background .15s ease; display: flex; align-items: center; gap: 8px;
  }
  .lang-toggle:hover { opacity: 0.9; }
  .lang-toggle .lang-icon { width: 18px; height: 18px; }
  .lang-toggle .lang-flag { font-size: 0.9rem; }

</style>
</head>

<script>
/* ==========================================================
   CORE RENDER LOGIC — Front View SVG Construction
   Strictly solid fills. Pure modular functions.
   ========================================================== */

function shadeColor(hex, amt) {
    let c = hex.replace('#','');
    if (c.length === 3) c = c.split('').map(x => x+x).join('');
    const num = parseInt(c, 16);
    let r = (num>>16)+amt, g = ((num>>8)&0xff)+amt, b = (num&0xff)+amt;
    r = Math.max(Math.min(255,r),0); g = Math.max(Math.min(255,g),0); b = Math.max(Math.min(255,b),0);
    return "#" + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

function mirror(inner) {
    return `<g transform="translate(200,0) scale(-1,1)">${inner}</g>`;
}

// Scales markup around the same head center/anchor used by the face, so
// hair, beard, ears, and hats all grow/shrink together with Face Size
// instead of staying fixed while the face changes size underneath them.
function scaleWithHead(markup, headSize) {
    if (headSize !== 1.0) {
        return `<g transform="translate(100,100) scale(${headSize}) translate(-100,-100)">${markup}</g>`;
    }
    return markup;
}

/* ---------- ANATOMY ---------- */
function anatomyBase(colorSkin) {
    const neckShadow = shadeColor(colorSkin, -30);
    return `
        <!-- Neck -->
        <path d="M82,145 L82,185 C90,195 110,195 118,185 L118,145 Z" fill="${colorSkin}"/>
        <path d="M82,145 L82,165 C90,175 110,175 118,165 L118,145 Z" fill="${neckShadow}" opacity="0.5"/>
        <!-- Shoulders / Base Torso -->
        <path d="M30,240 C35,190 60,170 82,170 L118,170 C140,170 165,190 170,240 Z" fill="${colorSkin}"/>
    `;
}

/* ---------- EARS ---------- */
function earMarkup(colorSkin, earSize, earShape, headSize) {
    let leftEar, rightEar;
    switch(earShape) {
        case "round":
            leftEar = `<path d="M48,95 C42,95 34,95 34,105 C34,115 42,122 48,118 C54,122 62,115 62,105 C62,95 54,95 48,95 Z" fill="${colorSkin}"/>`;
            rightEar = `<path d="M152,95 C158,95 166,95 166,105 C166,115 158,122 152,118 C146,122 138,115 138,105 C138,95 146,95 152,95 Z" fill="${colorSkin}"/>`;
            break;
        case "broad":
            leftEar = `<path d="M48,96 C42,90 24,94 24,108 C24,120 34,126 46,122 C48,118 50,110 48,96 Z" fill="${colorSkin}"/>`;
            rightEar = `<path d="M152,96 C158,90 176,94 176,108 C176,120 166,126 154,122 C152,118 150,110 152,96 Z" fill="${colorSkin}"/>`;
            break;
        case "elfin":
            leftEar = `<path d="M48,95 C45,90 34,90 34,108 C34,116 38,120 44,118 C46,108 47,100 48,95 Z" fill="${colorSkin}"/>`;
            rightEar = `<path d="M152,95 C155,90 166,90 166,108 C166,116 162,120 156,118 C154,108 153,100 152,95 Z" fill="${colorSkin}"/>`;
            break;
        case "pointed":
        default:
            leftEar = `<path d="M48,96 C42,92 26,96 28,108 C30,118 38,124 46,120 C48,114 48,105 48,96 Z" fill="${colorSkin}"/>`;
            rightEar = `<path d="M152,96 C158,92 174,96 172,108 C170,118 162,124 154,120 C152,114 152,105 152,96 Z" fill="${colorSkin}"/>`;
            break;
    }
    const scaleLeft = (svg) => `<g transform="translate(48,95) scale(${earSize}) translate(-48,-95)">${svg}</g>`;
    const scaleRight = (svg) => `<g transform="translate(152,95) scale(${earSize}) translate(-152,-95)">${svg}</g>`;
    const ears = scaleLeft(leftEar) + scaleRight(rightEar);
    // Bind ears to the same center/scale as the face (headSize) so they stay
    // attached to the jawline instead of drifting when Face Size changes.
    if (headSize !== 1.0) {
        return `<g transform="translate(100,100) scale(${headSize}) translate(-100,-100)">${ears}</g>`;
    }
    return ears;
}

/* ---------- FACE SHAPES ----------
   Each shape uses a distinct cheek width, taper, and jaw termination so the
   four options read as clearly different silhouettes at a glance. */
function faceMarkup(shape, foreHeight, colorSkin, headSize) {
    let path;
    const fy = foreHeight === "high" ? 18 : (foreHeight === "low" ? 30 : 25);
    switch(shape) {
        case "square":
            // Wide, boxy cheeks that stay nearly vertical down to a broad, flat jaw.
            path = `M100,${fy} C138,${fy} 156,50 156,90 C156,120 154,148 146,166 C140,178 122,182 100,182 C78,182 60,178 54,166 C46,148 44,120 44,90 C44,50 62,${fy} 100,${fy} Z`;
            break;
        case "round":
            // Wide circular cheeks with a soft, full jaw that never tapers to a point.
            path = `M100,${fy} C140,${fy} 160,56 160,98 C160,126 156,150 144,166 C132,182 116,190 100,190 C84,190 68,182 56,166 C44,150 40,126 40,98 C40,56 60,${fy} 100,${fy} Z`;
            break;
        case "heart":
            // Broad temples/cheekbones narrowing sharply to a small, pointed chin.
            path = `M100,${fy} C148,${fy} 166,48 162,88 C159,116 150,140 136,156 L118,178 C112,183 106,187 100,188 C94,187 88,183 82,178 L64,156 C50,140 41,116 38,88 C34,48 52,${fy} 100,${fy} Z`;
            break;
        case "oval":
        default:
            // Balanced, gently egg-shaped taper — the default versatile face.
            path = `M100,${fy} C132,${fy} 152,52 152,92 C152,128 142,152 128,166 C117,176 108,180 100,180 C92,180 83,176 72,166 C58,152 48,128 48,92 C48,52 68,${fy} 100,${fy} Z`;

    const facePath = `<path d="${path}" fill="${colorSkin}"/>`;
    if (headSize !== 1.0) {
        return `<g transform="translate(100,100) scale(${headSize}) translate(-100,-100)">${facePath}</g>`;
    }
    return facePath;
}

/* ---------- EYES ---------- */
function eyeMarkup(style, spacing, colorEye, colorSkin) {
    const cx = 77 + (spacing - 1) * 6, cy = 93;
    let white, irisR = 5, irisCx = cx, irisCy = cy, lid = "";
    switch(style) {
        case "round":
            white = `<circle cx="${cx}" cy="${cy}" r="9" fill="#fdfaf1"/>`;
            irisR = 5.5; break;
        case "narrow":
            white = `<ellipse cx="${cx}" cy="${cy}" rx="13" ry="4.2" fill="#fdfaf1"/>`;
            irisR = 3.6; break;
        case "downturned":
            white = `<path d="M63,90 C68,85 87,86 91,93 C86,101 68,100 63,90 Z" fill="#fdfaf1"/>`;
            irisCx = cx + 1; irisCy = cy + 2; break;
        case "upturned":
            white = `<path d="M63,95 C69,84 88,84 91,90 C85,98 68,99 63,95 Z" fill="#fdfaf1"/>`;
            irisCx = cx + 1; irisCy = cy - 2; break;
        case "hooded":
            white = `<path d="M64,92 C69,85 85,85 90,92 C85,99 69,99 64,92 Z" fill="#fdfaf1"/>`;
            lid = `<path d="M61,85 C68,80 86,80 93,86 C86,84 70,84 61,85 Z" fill="${colorSkin}"/>`;
            break;
        case "almond":
        default:
            white = `<path d="M64,92 C69,85 85,85 90,92 C85,99 69,99 64,92 Z" fill="#fdfaf1"/>`;
    }
    const iris  = `<circle cx="${irisCx}" cy="${irisCy}" r="${irisR}" fill="${colorEye}"/>`;
    const pupil = `<circle cx="${irisCx}" cy="${irisCy}" r="${irisR*0.4}" fill="#1a1410"/>`;
    const glint = `<circle cx="${irisCx+1.4}" cy="${irisCy-1.4}" r="${irisR*0.22}" fill="#ffffff"/>`;
    const singleEye = `${white}${iris}${pupil}${glint}${lid}`;
    return singleEye + mirror(singleEye);
}

        <pattern id="tex-tartan" patternUnits="userSpaceOnUse" width="14" height="14"><path d="M0 3H14M0 10H14M3 0V14M10 0V14" stroke="#000" stroke-width="2" opacity=".14"/><path d="M0 6H14M6 0V14" stroke="#fff" stroke-width="1" opacity=".12"/></pattern>
        <pattern id="tex-scales" patternUnits="userSpaceOnUse" width="12" height="8"><path d="M0 0Q3 6 6 0Q9 6 12 0M-6 8Q-3 2 0 8Q3 2 6 8Q9 2 12 8" fill="none" stroke="#000" stroke-width="1" opacity=".2"/></pattern>
        <!-- Selected material is embedded directly for reliable browser/export rendering. -->
        <pattern id="cloth-texture" patternUnits="userSpaceOnUse" width="${clothPatternWidth}" height="${clothPatternHeight}">
          ${clothPatternBodies[selectedMaterial]}
        </pattern>
        <!-- A hammered or burnished metal texture. -->
        <pattern id="metal-texture" patternUnits="userSpaceOnUse" width="20" height="20">
           <rect width="20" height="20" fill="transparent" />
           <circle cx="5" cy="5" r="1.5" fill="#fff" opacity="0.08" />
           <circle cx="15" cy="15" r="2" fill="#fff" opacity="0.05" />
           <circle cx="10" cy="8" r="1" fill="#000" opacity="0.05" />
           <circle cx="3" cy="18" r="1.2" fill="#000" opacity="0.06" />
        </pattern>
      </defs>
    `;

    // We'll create textured fills for our main materials.
    const fill_inner = `fill="${s.colorInner}"`;
    const fill_outer = `fill="${s.colorOuter}"`;
    const fill_cloak = `fill="${s.colorCloak}"`;
    const fill_accent_metal = `fill="${s.colorAccent}"`;

    return [
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">`,
        materialDefs,
        anatomyBase(s.colorSkin),
        wardrobeMarkup(s.clothingType, s.colorInner, s.colorOuter, s.colorCloak, s.colorAccent),
        garmentStripeMarkup(s.dualStripe, s.colorGarment2),
        earMarkup(s.colorSkin, s.earSize, s.earShape, s.headSize),
        hairBackMarkup(s.hairStyle, s.colorHair, s.headSize, s.hairSize),
        faceMarkup(s.faceShape, s.foreheadHeight, s.colorSkin, s.headSize),
        chinMarkup(s.chinShape, s.colorSkin, s.headSize),
        beardMarkup(s.beardStyle, s.colorHair, s.headSize),
        mouthMarkup(s.mouthStyle, s.colorLip),
        noseMarkup(s.noseShape, s.noseScale, s.colorSkin),
        eyebrowMarkup(s.eyebrowStyle, s.colorHair),
        eyeMarkup(s.eyeShape, s.eyeSpacing, s.colorEye, shadeColor(s.colorSkin, -30)),
        healthMarkup(s.healthState || "well", s.colorSkin),
        hairFrontMarkup(s.hairStyle, s.colorHair, s.headSize, s.hairSize),
        hatMarkup(s.hatStyle, hatInner, hatOuter, s.headSize, s.hatSize),
        `</svg>`
    ].join("");
}

/* ==========================================================
   APPLICATION STATE & PRESETS
   Presets now live in an external character_presets.js file (loaded via
   a <script> tag above, not fetch — this way it works when the HTML is
   opened directly by double-clicking, no local server required).
   Add, remove, or tweak characters by editing that file — no changes to
   this script are needed.
   ========================================================== */
let presets = {};

// Minimal built-in fallback, used only if character_presets.js fails to
// load (for example if this file is opened directly as file:// — some
// browsers block fetch() of local files under that protocol; serving the
// folder from a local web server avoids it, e.g. `python -m http.server`).
// This keeps the tool usable and shows a clear on-screen warning rather
// than failing silently.
const FALLBACK_PRESET = {
    name: "Custom Character", healthState: "well",
    noseScale: 1.0, noseShape: "straight",
    eyeShape: "almond", eyeSpacing: 1.0,
    eyebrowStyle: "arched", mouthStyle: "neutral",
    hairStyle: "short", beardStyle: "none", hatStyle: "none",
    clothingType: "tunic", materialStyle: "woven_linen",
    faceShape: "oval", foreheadHeight: "medium", chinShape: "rounded",
    earSize: 1.0, earShape: "round", headSize: 1.0, hairSize: 1.0, hatSize: 1.0,
    hatMatchHair: false,
    dualStripe: false,
    colorInner: "#4a423a", colorOuter: "#2f2b25", colorCloak: "#1a1815",
    colorAccent: "#3b3831", colorGarment2: "#8a7a5a",
    colorSkin: "#c49366", colorHair: "#241c14", colorEye: "#4a3b32", colorLip: "#9a5f52"
};

let state = { ...FALLBACK_PRESET };

function loadPresets() {
    if (typeof CHARACTER_PRESETS_DATA !== "undefined" && CHARACTER_PRESETS_DATA && Object.keys(CHARACTER_PRESETS_DATA).length) {
        presets = CHARACTER_PRESETS_DATA;
        populatePresetSelect();
        const firstKey = (typeof CHARACTER_PRESETS_META !== "undefined" && CHARACTER_PRESETS_META.defaultPreset) || Object.keys(presets)[0];
        state = { hairSize: 1.0, hatSize: 1.0, hatMatchHair: false, ...presets[firstKey] };
        hidePresetError();
    } else {
        console.error("CHARACTER_PRESETS_DATA not found — character_presets.js did not load.");
        showPresetError();
    }
    writeStateIntoUI();
    render();
}

function populatePresetSelect() {
    const select = document.getElementById("characterPresetSelect");
    select.innerHTML = '<option value="">-- Select --</option>';

    const groups = {
      "story": { label: (typeof CHARACTER_PRESETS_META !== "undefined" ? CHARACTER_PRESETS_META.groupLabel : "Story characters"), characters: Object.keys(presets) }
    };

    Object.values(groups).forEach(group => {
        const optgroup = document.createElement("optgroup");
        optgroup.label = group.label;
        group.characters.forEach(key => {
            if (presets[key]) {
                const option = document.createElement("option");
                option.value = key;
                option.textContent = presets[key].name;
                optgroup.appendChild(option);
            }
        });
        select.appendChild(optgroup);
    });
}

function showPresetError() {
    const el = document.getElementById("preset-status");
    if (el) {
        el.style.display = "block";
        el.textContent = "Couldn't find character_presets.js — make sure it's saved in the same folder as this HTML file (and hasn't been renamed). Using one default character for now.";
    }
}
function hidePresetError() {
    const el = document.getElementById("preset-status");
    if (el) el.style.display = "none";
}

/* ==========================================================
   UI CONTROLLER
   ========================================================== */
const ids = ["health-state:healthState","face-shape:faceShape","forehead-height:foreheadHeight","eye-spacing:eyeSpacing","ear-size:earSize","head-size:headSize","hair-size:hairSize","hat-size:hatSize","chin-shape:chinShape","eye-shape:eyeShape","eyebrow-style:eyebrowStyle","nose-shape:noseShape","mouth-style:mouthStyle","hair-style:hairStyle","beard-style:beardStyle","hat-style:hatStyle","clothing-type:clothingType","material-style:materialStyle","ear-shape:earShape"];
const colorIds = ["color-inner:colorInner","color-outer:colorOuter","color-cloak:colorCloak","color-accent:colorAccent","color-skin:colorSkin","color-hair:colorHair","color-eye:colorEye","color-lip:colorLip","color-garment2:colorGarment2"];

function formatName(str) { return str.replace(/_/g, " ").replace(/\b\w/g, l => l.toUpperCase()); }
function slugify(str) { return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "custom_character"; }

function render() {
    document.getElementById("svg-container").innerHTML = buildSVG(state);
    document.getElementById("caption-name").textContent = formatName(state.name);
    document.getElementById("caption-sub").textContent = slugify(state.name) + ".svg";
}

function readUIIntoState() {
    ids.forEach(p => { const [id, k] = p.split(":"); state[k] = document.getElementById(id).value; });
    colorIds.forEach(p => { const [id, k] = p.split(":"); state[k] = document.getElementById(id).value; });
    state.noseScale = parseFloat(document.getElementById("nose-scale").value);
    state.eyeSpacing = parseFloat(document.getElementById("eye-spacing").value);
    state.earSize = parseFloat(document.getElementById("ear-size").value);
    state.headSize = parseFloat(document.getElementById("head-size").value);
    state.hairSize = parseFloat(document.getElementById("hair-size").value);
    state.hatSize = parseFloat(document.getElementById("hat-size").value);
    state.hatMatchHair = document.getElementById("hat-match-hair").checked;
    state.dualStripe = document.getElementById("dual-stripe").checked;
    document.getElementById("nose-scale-val").textContent = state.noseScale.toFixed(2) + "×";
    document.getElementById("eye-spacing-val").textContent = state.eyeSpacing.toFixed(1) + "×";
    document.getElementById("ear-size-val").textContent = state.earSize.toFixed(1) + "×";
    document.getElementById("head-size-val").textContent = state.headSize.toFixed(1) + "×";
    document.getElementById("hair-size-val").textContent = state.hairSize.toFixed(1) + "×";
    document.getElementById("hat-size-val").textContent = state.hatSize.toFixed(1) + "×";
    document.getElementById("stripe-row").style.display = state.dualStripe ? "flex" : "none";
    state.name = "Custom Character";
    render();
}

function writeStateIntoUI() {
    ids.forEach(p => { const [id, k] = p.split(":"); document.getElementById(id).value = state[k]; });
    colorIds.forEach(p => { const [id, k] = p.split(":"); document.getElementById(id).value = state[k]; });
    document.getElementById("nose-scale").value = state.noseScale;
    document.getElementById("nose-scale-val").textContent = state.noseScale.toFixed(2) + "×";
    document.getElementById("eye-spacing").value = state.eyeSpacing;
    document.getElementById("eye-spacing-val").textContent = state.eyeSpacing.toFixed(1) + "×";
    document.getElementById("ear-size").value = state.earSize;
    document.getElementById("ear-size-val").textContent = state.earSize.toFixed(1) + "×";
    document.getElementById("head-size").value = state.headSize;
    document.getElementById("head-size-val").textContent = state.headSize.toFixed(1) + "×";
    document.getElementById("hair-size").value = state.hairSize;
    document.getElementById("hair-size-val").textContent = state.hairSize.toFixed(1) + "×";
    document.getElementById("hat-size").value = state.hatSize;
    document.getElementById("hat-size-val").textContent = state.hatSize.toFixed(1) + "×";
    document.getElementById("hat-match-hair").checked = !!state.hatMatchHair;
    document.getElementById("dual-stripe").checked = !!state.dualStripe;
    document.getElementById("stripe-row").style.display = state.dualStripe ? "flex" : "none";
}

const presetSelect = document.getElementById("characterPresetSelect");

document.getElementById("load-preset").addEventListener("click", () => {
    const key = presetSelect.value;
    if (presets[key]) { state = { hairSize: 1.0, hatSize: 1.0, hatMatchHair: false, ...presets[key] }; writeStateIntoUI(); render(); }
});

document.querySelectorAll(".sidebar input, .sidebar select").forEach(el => {
    if(el.id !== "characterPresetSelect") el.addEventListener("input", readUIIntoState);
});

/* ==========================================================
   EXPORTS
   ========================================================== */
function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

document.getElementById("export-svg").addEventListener("click", () => {
    const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + buildSVG(state)], { type:"image/svg+xml;charset=utf-8" });
    triggerDownload(blob, slugify(state.name) + ".svg");
});

document.getElementById("export-json").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
    triggerDownload(blob, slugify(state.name) + ".json");
});

document.getElementById("export-batch").addEventListener("click", async () => {
    const btn = document.getElementById("export-batch");
    const orig = btn.textContent;
    btn.textContent = "Preparing…"; btn.disabled = true;
    try {
        if(typeof JSZip === "undefined") throw new Error("JSZip unavailable");
        const zip = new JSZip();
        Object.entries(presets).forEach(([key, preset]) => {
            zip.file(`${key}.svg`, '<?xml version="1.0" encoding="UTF-8"?>\n' + buildSVG(preset));
            zip.file(`${key}.json`, JSON.stringify(preset, null, 2));
        });
        const blob = await zip.generateAsync({ type:"blob" });
        triggerDownload(blob, "nepalese_character_profiles.zip");
    } catch(err) {
        Object.entries(presets).forEach(([key, preset], i) => {
            setTimeout(() => {
                triggerDownload(new Blob([JSON.stringify(preset, null, 2)], { type:"application/json" }), `${key}.json`);
            }, i * 300);
        });
    } finally {
        setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 500);
    }
});

/* Initialize */
loadPresets();
</script>
</body>
</html>
