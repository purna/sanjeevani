<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc143c"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff8e7"/>
    </linearGradient>
  </defs>
  <!-- Nepal flag shape background (double pennon) -->
  <path d="M10 10 L90 10 L90 35 L25 35 L25 90 L10 90 Z" fill="url(#bgGrad)"/>
  <path d="M10 10 L90 10 L90 35 L25 35 L25 90 L10 90 Z" fill="none" stroke="#003893" stroke-width="3"/>
  <path d="M13 13 L87 13 L87 32 L28 32 L28 87 L13 87 Z" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Sun from Nepal flag (12-pointed) -->
  <g transform="translate(50, 45)">
    <circle r="18" fill="url(#starGrad)" filter="url(#glow)"/>
    <g stroke="url(#starGrad)" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-16"/>
      <line x1="0" y1="22" x2="0" y2="16"/>
      <line x1="-22" y1="0" x2="-16" y2="0"/>
      <line x1="22" y1="0" x2="16" y2="0"/>
      <line x1="-15.5" y1="-15.5" x2="-11.3" y2="-11.3"/>
      <line x1="15.5" y1="15.5" x2="11.3" y2="11.3"/>
      <line x1="-15.5" y1="15.5" x2="-11.3" y2="11.3"/>
      <line x1="15.5" y1="-15.5" x2="11.3" y2="-11.3"/>
    </g>
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </g>

  <!-- Moon from Nepal flag (crescent) -->
  <g transform="translate(50, 68)">
    <path d="M-10 0 A10 10 0 1 1 10 0 A7 7 0 1 0 -10 0" fill="url(#starGrad)"/>
  </g>
</svg>